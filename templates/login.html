<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF‑8">
    <title>Iniciar Sesión</title>
</head>
<body>
    <h1>Inicio de Sesión</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <p>
            {{ form.correo.label }}<br>
            {{ form.correo() }}
        </p>
        <p>
            {{ form.contraseña.label }}<br>
            {{ form.contraseña() }}
        </p>
        <p>{{ form.entrar() }}</p>
    </form>
</body>
</html>
