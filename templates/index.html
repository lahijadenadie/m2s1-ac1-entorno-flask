<!DOCTYPE html>
<html>
<head>
    <title>Formulario de Contacto</title>
</head>
<body>
    <h1>Contacto</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <p>
            {{ form.nombre.label }}<br>
            {{ form.nombre() }}
        </p>
        <p>
            {{ form.correo.label }}<br>
            {{ form.correo() }}
        </p>
        <p>{{ form.enviar() }}</p>
    </form>
</body>
</html>
